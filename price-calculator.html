<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Price Architect — Selling Price Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #18181f;
    --surface3: #1e1e28;
    --border: #2a2a38;
    --border-bright: #3a3a52;
    --accent: #7c6bff;
    --accent2: #ff6b9d;
    --accent3: #6bffc8;
    --accent4: #ffb86b;
    --text: #e8e8f0;
    --text-dim: #7a7a95;
    --text-muted: #4a4a62;
    --profit-pos: #6bffc8;
    --profit-neg: #ff6b6b;
    --shadow: 0 4px 24px rgba(0,0,0,0.5);
    --shadow-lg: 0 8px 48px rgba(0,0,0,0.6);
    --radius: 12px;
    --radius-sm: 8px;
    --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse 80% 50% at 20% -10%, rgba(124,107,255,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 110%, rgba(107,255,200,0.08) 0%, transparent 60%);
  }

  /* ─── Header ─── */
  .app-header {
    padding: 32px 48px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    background: linear-gradient(180deg, rgba(124,107,255,0.06) 0%, transparent 100%);
  }

  .app-title {
    font-family: 'Syne', sans-serif;
    font-size: clamp(22px, 4vw, 32px);
    font-weight: 800;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, #fff 30%, var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .app-subtitle {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .header-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  /* ─── Buttons ─── */
  .btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.05em;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    padding: 8px 16px;
    transition: all var(--transition);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }

  .btn-primary {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 0 20px rgba(124,107,255,0.3);
  }
  .btn-primary:hover { background: #9b8dff; box-shadow: 0 0 28px rgba(124,107,255,0.5); transform: translateY(-1px); }

  .btn-ghost {
    background: var(--surface3);
    color: var(--text-dim);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { background: var(--surface2); color: var(--text); border-color: var(--border-bright); }

  .btn-danger {
    background: rgba(255,107,107,0.12);
    color: #ff6b6b;
    border: 1px solid rgba(255,107,107,0.2);
  }
  .btn-danger:hover { background: rgba(255,107,107,0.22); }

  .btn-success {
    background: rgba(107,255,200,0.12);
    color: var(--accent3);
    border: 1px solid rgba(107,255,200,0.2);
  }
  .btn-success:hover { background: rgba(107,255,200,0.22); }

  .btn-sm { padding: 5px 10px; font-size: 10px; }

  /* ─── Layout ─── */
  .app-body {
    padding: 32px 48px;
    max-width: 1600px;
    margin: 0 auto;
  }

  #groups-container {
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  .empty-state {
    text-align: center;
    padding: 80px 32px;
    color: var(--text-muted);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
  .empty-state h3 { font-family: 'Syne', sans-serif; font-size: 18px; color: var(--text-dim); margin-bottom: 8px; }

  /* ─── Overall Totals ─── */
  .overall-totals {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10,10,15,0.92);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 12px 48px;
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
  }

  .total-label {
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-right: 8px;
  }

  .total-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 6px 14px;
  }

  .total-chip .chip-label {
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .total-chip .chip-value {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
  }

  .total-chip.highlight { border-color: var(--accent); }
  .total-chip.highlight .chip-value { color: var(--accent); }
  .total-chip.profit .chip-value { color: var(--profit-pos); }

  /* ─── Inputs ─── */
  .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .field label {
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  input[type="text"], input[type="number"] {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    outline: none;
    transition: border-color var(--transition), box-shadow var(--transition);
    width: 100%;
    -moz-appearance: textfield;
  }
  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }

  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(124,107,255,0.15);
  }

  input::placeholder { color: var(--text-muted); }

  /* ─── Tooltip ─── */
  [data-tooltip] { position: relative; }
  [data-tooltip]:hover::after {
    content: attr(data-tooltip);
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface3);
    border: 1px solid var(--border-bright);
    color: var(--text);
    font-size: 10px;
    padding: 4px 8px;
    border-radius: 4px;
    white-space: nowrap;
    pointer-events: none;
    z-index: 200;
  }

  /* ─── Scrollbar ─── */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 2px; }

  /* ─── Animations ─── */
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .animate-in { animation: slideIn 0.25s ease forwards; }

  /* ─── Responsive ─── */
  @media (max-width: 700px) {
    .app-header, .app-body { padding: 20px; }
    .overall-totals { padding: 10px 20px; gap: 10px; }
    .total-chip { padding: 5px 10px; }
  }

  /* ─── Modal ─── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border-bright);
    border-radius: var(--radius);
    padding: 28px;
    max-width: 440px;
    width: 100%;
    box-shadow: var(--shadow-lg);
    animation: slideIn 0.2s ease;
  }

  .modal h3 {
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .modal p { color: var(--text-dim); font-size: 12px; margin-bottom: 20px; line-height: 1.6; }

  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

  /* ─── Toast ─── */
  #toast-container {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 2000;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .toast {
    background: var(--surface3);
    border: 1px solid var(--border-bright);
    border-radius: var(--radius-sm);
    padding: 10px 16px;
    font-size: 12px;
    color: var(--text);
    box-shadow: var(--shadow);
    animation: slideIn 0.2s ease;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .toast.success { border-color: var(--accent3); }
  .toast.error { border-color: #ff6b6b; }
</style>
</head>

<script type="module">

/* ══════════════════════════════════════════
   UTILITIES
══════════════════════════════════════════ */

const fmt = (n) => isNaN(n) || !isFinite(n) ? '$0.00' :
  new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2 }).format(n);

const pct = (n) => isNaN(n) || !isFinite(n) ? '0%' : n.toFixed(1) + '%';

let _idCounter = 0;
const uid = () => 'id_' + (++_idCounter) + '_' + Math.random().toString(36).slice(2, 7);

function toast(msg, type = 'success') {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.getElementById('toast-container').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

/* ══════════════════════════════════════════
   STORE — central state
══════════════════════════════════════════ */

class Store {
  constructor() {
    this.groups = new Map(); // groupId → { name, sharedCosts, products: Map }
    this.listeners = [];
  }

  subscribe(fn) { this.listeners.push(fn); }
  notify() { this.listeners.forEach(fn => fn()); }

  addGroup(id, data = {}) {
    this.groups.set(id, {
      name: data.name || 'New Group',
      sharedCosts: data.sharedCosts ?? 0,
      products: new Map()
    });
    this.notify();
  }

  removeGroup(id) {
    this.groups.delete(id);
    this.notify();
  }

  updateGroup(id, key, value) {
    const g = this.groups.get(id);
    if (g) { g[key] = value; this.notify(); }
  }

  addProduct(groupId, prodId, data = {}) {
    const g = this.groups.get(groupId);
    if (!g) return;
    g.products.set(prodId, {
      name: data.name || 'New Product',
      directCost: data.directCost ?? 0,
      indirectCost: data.indirectCost ?? 0,
      otherCosts: data.otherCosts ?? 0,
      margin: data.margin ?? 20,
      weight: data.weight ?? 1
    });
    this.notify();
  }

  removeProduct(groupId, prodId) {
    const g = this.groups.get(groupId);
    if (g) { g.products.delete(prodId); this.notify(); }
  }

  updateProduct(groupId, prodId, key, value) {
    const g = this.groups.get(groupId);
    if (!g) return;
    const p = g.products.get(prodId);
    if (p) { p[key] = value; this.notify(); }
  }

  calcProduct(groupId, prodId) {
    const g = this.groups.get(groupId);
    if (!g) return null;
    const p = g.products.get(prodId);
    if (!p) return null;

    // Distribute shared costs by weight
    const products = [...g.products.values()];
    const totalWeight = products.reduce((s, p2) => s + (p2.weight || 1), 0);
    const sharedShare = totalWeight > 0
      ? g.sharedCosts * ((p.weight || 1) / totalWeight)
      : 0;

    const cost = p.directCost + p.indirectCost + p.otherCosts + sharedShare;
    const margin = Math.min(Math.max(p.margin, 0), 99.99);
    const sellingPrice = margin < 100 ? cost / (1 - margin / 100) : 0;
    const profit = sellingPrice - cost;
    return { cost, sellingPrice, profit, margin, sharedShare };
  }

  calcGroup(groupId) {
    const g = this.groups.get(groupId);
    if (!g) return null;
    let totalCost = 0, totalRevenue = 0, totalProfit = 0;
    for (const [pid] of g.products) {
      const r = this.calcProduct(groupId, pid);
      if (r) {
        totalCost += r.cost;
        totalRevenue += r.sellingPrice;
        totalProfit += r.profit;
      }
    }
    return { totalCost, totalRevenue, totalProfit };
  }

  calcOverall() {
    let totalCost = 0, totalRevenue = 0, totalProfit = 0, totalProducts = 0;
    for (const [gid, g] of this.groups) {
      const r = this.calcGroup(gid);
      if (r) {
        totalCost += r.totalCost;
        totalRevenue += r.totalRevenue;
        totalProfit += r.totalProfit;
      }
      totalProducts += g.products.size;
    }
    const avgMargin = totalRevenue > 0 ? (totalProfit / totalRevenue) * 100 : 0;
    return { totalCost, totalRevenue, totalProfit, avgMargin, totalProducts, totalGroups: this.groups.size };
  }

  serialize() {
    const data = [];
    for (const [gid, g] of this.groups) {
      const prods = [];
      for (const [pid, p] of g.products) prods.push({ id: pid, ...p });
      data.push({ id: gid, name: g.name, sharedCosts: g.sharedCosts, products: prods });
    }
    return JSON.stringify(data);
  }

  deserialize(json) {
    const data = JSON.parse(json);
    this.groups.clear();
    for (const g of data) {
      this.groups.set(g.id, {
        name: g.name,
        sharedCosts: g.sharedCosts,
        products: new Map(g.products.map(p => [p.id, { name: p.name, directCost: p.directCost, indirectCost: p.indirectCost, otherCosts: p.otherCosts, margin: p.margin, weight: p.weight ?? 1 }]))
      });
    }
    this.notify();
  }
}

const store = new Store();

/* ══════════════════════════════════════════
   PRODUCT ITEM WEB COMPONENT
══════════════════════════════════════════ */

class ProductItem extends HTMLElement {
  constructor() { super(); }

  connectedCallback() {
    this.groupId = this.getAttribute('group-id');
    this.productId = this.getAttribute('product-id');
    this.render();
    store.subscribe(() => this.updateDisplay());
  }

  disconnectedCallback() {
    // Listeners are store-level, cleanup would go here if needed
  }

  render() {
    const p = store.groups.get(this.groupId)?.products.get(this.productId);
    if (!p) return;

    this.innerHTML = `
      <div class="product-card animate-in" style="
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
        transition: border-color var(--transition);
        position: relative;
      ">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
          <span style="font-size:9px; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-muted);">Product</span>
          <button class="btn btn-danger btn-sm" data-action="delete">✕</button>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px;">
          <div class="field" style="grid-column:1/-1;">
            <label>Product Name</label>
            <input type="text" data-field="name" value="${p.name}" placeholder="e.g. Widget A">
          </div>
          <div class="field">
            <label>Direct Cost ($)</label>
            <input type="number" data-field="directCost" value="${p.directCost}" min="0" step="0.01" placeholder="0.00">
          </div>
          <div class="field">
            <label>Indirect Cost ($)</label>
            <input type="number" data-field="indirectCost" value="${p.indirectCost}" min="0" step="0.01" placeholder="0.00">
          </div>
          <div class="field">
            <label>Other Costs ($)</label>
            <input type="number" data-field="otherCosts" value="${p.otherCosts}" min="0" step="0.01" placeholder="0.00">
          </div>
          <div class="field">
            <label>Margin (%)</label>
            <input type="number" data-field="margin" value="${p.margin}" min="0" max="99.9" step="0.1" placeholder="20">
          </div>
          <div class="field">
            <label>Weight (shared cost)</label>
            <input type="number" data-field="weight" value="${p.weight ?? 1}" min="0.1" step="0.1" placeholder="1">
          </div>
        </div>

        <div class="product-results" style="
          display:grid; grid-template-columns:repeat(3,1fr); gap:6px;
          background: var(--surface3);
          border: 1px solid var(--border);
          border-radius: var(--radius-sm);
          padding: 10px;
        ">
          <div style="text-align:center;">
            <div style="font-size:9px; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-muted); margin-bottom:3px;">Cost</div>
            <div class="res-cost" style="font-size:13px; font-weight:500; color:var(--text);">$0.00</div>
          </div>
          <div style="text-align:center; border-left:1px solid var(--border); border-right:1px solid var(--border);">
            <div style="font-size:9px; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-muted); margin-bottom:3px;">Selling Price</div>
            <div class="res-price" style="font-size:13px; font-weight:500; color:var(--accent);">$0.00</div>
          </div>
          <div style="text-align:center;">
            <div style="font-size:9px; text-transform:uppercase; letter-spacing:0.1em; color:var(--text-muted); margin-bottom:3px;">Profit</div>
            <div class="res-profit" style="font-size:13px; font-weight:500;">$0.00</div>
          </div>
        </div>

        <div class="shared-alloc" style="
          margin-top:6px; padding:5px 8px;
          background: rgba(124,107,255,0.06);
          border: 1px solid rgba(124,107,255,0.15);
          border-radius: var(--radius-sm);
          font-size:10px; color:var(--text-dim);
          display: flex; justify-content:space-between;
        ">
          <span>Shared cost allocated:</span>
          <span class="res-shared" style="color:var(--accent);">$0.00</span>
        </div>
      </div>
    `;

    this.querySelector('[data-action="delete"]').addEventListener('click', () => {
      store.removeProduct(this.groupId, this.productId);
    });

    this.querySelectorAll('input').forEach(input => {
      input.addEventListener('input', (e) => {
        const field = e.target.dataset.field;
        let value = field === 'name' ? e.target.value : parseFloat(e.target.value) || 0;
        store.updateProduct(this.groupId, this.productId, field, value);
      });
    });

    this.updateDisplay();
  }

  updateDisplay() {
    const r = store.calcProduct(this.groupId, this.productId);
    if (!r) return;

    const costEl = this.querySelector('.res-cost');
    const priceEl = this.querySelector('.res-price');
    const profitEl = this.querySelector('.res-profit');
    const sharedEl = this.querySelector('.res-shared');

    if (!costEl) return;

    costEl.textContent = fmt(r.cost);
    priceEl.textContent = fmt(r.sellingPrice);
    profitEl.textContent = fmt(r.profit);
    profitEl.style.color = r.profit >= 0 ? 'var(--profit-pos)' : 'var(--profit-neg)';
    if (sharedEl) sharedEl.textContent = fmt(r.sharedShare);
  }
}

customElements.define('product-item', ProductItem);

/* ══════════════════════════════════════════
   PRODUCT GROUP WEB COMPONENT
══════════════════════════════════════════ */

class ProductGroup extends HTMLElement {
  constructor() { super(); }

  connectedCallback() {
    this.groupId = this.getAttribute('group-id');
    this.render();
    store.subscribe(() => this.syncProducts());
    store.subscribe(() => this.updateSubtotals());
    this._renderedProducts = new Set();
  }

  render() {
    const g = store.groups.get(this.groupId);
    if (!g) return;

    const colors = ['#7c6bff','#ff6b9d','#6bffc8','#ffb86b','#6bbbff','#ff9d6b'];
    const colorIdx = [...store.groups.keys()].indexOf(this.groupId) % colors.length;
    const accent = colors[colorIdx] || '#7c6bff';
    this._accent = accent;

    this.innerHTML = `
      <div style="
        background: var(--surface);
        border: 1px solid var(--border);
        border-top: 3px solid ${accent};
        border-radius: var(--radius);
        overflow: hidden;
        box-shadow: var(--shadow);
        animation: slideIn 0.25s ease;
      ">
        <!-- Group Header -->
        <div style="
          padding: 18px 20px;
          background: linear-gradient(135deg, ${accent}10 0%, transparent 60%);
          border-bottom: 1px solid var(--border);
          display: flex;
          align-items: center;
          gap: 12px;
          flex-wrap: wrap;
        ">
          <div style="
            width: 8px; height: 8px; border-radius: 50%;
            background: ${accent};
            box-shadow: 0 0 10px ${accent};
            flex-shrink: 0;
          "></div>

          <div class="field" style="flex:1; min-width:160px; max-width:280px;">
            <label>Group Name</label>
            <input type="text" data-field="name" value="${g.name}" placeholder="Group name" style="font-family:'Syne',sans-serif; font-weight:700; font-size:14px;">
          </div>

          <div class="field" style="min-width:140px; max-width:200px;">
            <label>Shared / Set Costs ($)</label>
            <input type="number" data-field="sharedCosts" value="${g.sharedCosts}" min="0" step="0.01" placeholder="0.00">
          </div>

          <div style="margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
            <button class="btn btn-ghost btn-sm" data-action="add-product">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Add Product
            </button>
            <button class="btn btn-danger btn-sm" data-action="delete-group">✕ Delete Group</button>
          </div>
        </div>

        <!-- Products Container -->
        <div class="products-grid" style="
          display: grid;
          grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
          gap: 14px;
          padding: 18px 20px;
          min-height: 60px;
        ">
          <div class="no-products" style="
            grid-column: 1/-1;
            color: var(--text-muted);
            font-size: 11px;
            text-align: center;
            padding: 20px;
            border: 1px dashed var(--border);
            border-radius: var(--radius-sm);
          ">No products yet — click "Add Product"</div>
        </div>

        <!-- Group Subtotals -->
        <div style="
          padding: 14px 20px;
          border-top: 1px solid var(--border);
          background: var(--surface2);
          display: flex;
          align-items: center;
          gap: 16px;
          flex-wrap: wrap;
        ">
          <span style="font-size:9px; text-transform:uppercase; letter-spacing:0.12em; color:var(--text-muted); margin-right:4px;">Group Totals</span>
          <div style="display:flex; align-items:center; gap:6px; background:var(--surface3); border:1px solid var(--border); border-radius:100px; padding:5px 12px;">
            <span style="font-size:9px; color:var(--text-muted); text-transform:uppercase;">Cost</span>
            <span class="sub-cost" style="font-size:12px; font-weight:500; color:var(--text);">$0.00</span>
          </div>
          <div style="display:flex; align-items:center; gap:6px; background:var(--surface3); border:1px solid ${accent}40; border-radius:100px; padding:5px 12px;">
            <span style="font-size:9px; color:var(--text-muted); text-transform:uppercase;">Revenue</span>
            <span class="sub-revenue" style="font-size:12px; font-weight:500; color:${accent};">$0.00</span>
          </div>
          <div style="display:flex; align-items:center; gap:6px; background:var(--surface3); border:1px solid rgba(107,255,200,0.2); border-radius:100px; padding:5px 12px;">
            <span style="font-size:9px; color:var(--text-muted); text-transform:uppercase;">Profit</span>
            <span class="sub-profit" style="font-size:12px; font-weight:500; color:var(--profit-pos);">$0.00</span>
          </div>
          <div style="display:flex; align-items:center; gap:6px; background:var(--surface3); border:1px solid var(--border); border-radius:100px; padding:5px 12px;">
            <span style="font-size:9px; color:var(--text-muted); text-transform:uppercase;">Products</span>
            <span class="sub-count" style="font-size:12px; font-weight:500; color:var(--text);">0</span>
          </div>
        </div>
      </div>
    `;

    this.querySelector('[data-field="name"]').addEventListener('input', (e) => {
      store.updateGroup(this.groupId, 'name', e.target.value);
    });

    this.querySelector('[data-field="sharedCosts"]').addEventListener('input', (e) => {
      store.updateGroup(this.groupId, 'sharedCosts', parseFloat(e.target.value) || 0);
    });

    this.querySelector('[data-action="add-product"]').addEventListener('click', () => {
      const pid = uid();
      store.addProduct(this.groupId, pid);
    });

    this.querySelector('[data-action="delete-group"]').addEventListener('click', () => {
      store.removeGroup(this.groupId);
    });

    this._renderedProducts = new Set();
    this.syncProducts();
    this.updateSubtotals();
  }

  syncProducts() {
    const g = store.groups.get(this.groupId);
    if (!g) return;

    const grid = this.querySelector('.products-grid');
    if (!grid) return;

    const noProds = grid.querySelector('.no-products');

    // Remove deleted products
    if (this._renderedProducts) {
      for (const pid of [...this._renderedProducts]) {
        if (!g.products.has(pid)) {
          const el = grid.querySelector(`[product-id="${pid}"]`);
          if (el) el.remove();
          this._renderedProducts.delete(pid);
        }
      }
    } else {
      this._renderedProducts = new Set();
    }

    // Add new products
    for (const [pid] of g.products) {
      if (!this._renderedProducts.has(pid)) {
        const el = document.createElement('product-item');
        el.setAttribute('group-id', this.groupId);
        el.setAttribute('product-id', pid);
        grid.appendChild(el);
        this._renderedProducts.add(pid);
      }
    }

    if (noProds) {
      noProds.style.display = g.products.size > 0 ? 'none' : 'block';
    }
  }

  updateSubtotals() {
    const r = store.calcGroup(this.groupId);
    if (!r) return;

    const costEl = this.querySelector('.sub-cost');
    const revEl = this.querySelector('.sub-revenue');
    const profEl = this.querySelector('.sub-profit');
    const countEl = this.querySelector('.sub-count');

    if (!costEl) return;

    costEl.textContent = fmt(r.totalCost);
    revEl.textContent = fmt(r.totalRevenue);
    profEl.textContent = fmt(r.totalProfit);
    profEl.style.color = r.totalProfit >= 0 ? 'var(--profit-pos)' : 'var(--profit-neg)';

    const g = store.groups.get(this.groupId);
    if (countEl && g) countEl.textContent = g.products.size;
  }
}

customElements.define('product-group', ProductGroup);

/* ══════════════════════════════════════════
   CONTROLLER — App Logic
══════════════════════════════════════════ */

const container = document.getElementById('groups-container');
const emptyState = document.getElementById('empty-state');

let _renderedGroups = new Set();

function syncGroups() {
  // Remove deleted
  for (const gid of [..._renderedGroups]) {
    if (!store.groups.has(gid)) {
      const el = container.querySelector(`[group-id="${gid}"]`);
      if (el) el.remove();
      _renderedGroups.delete(gid);
    }
  }

  // Add new
  for (const [gid] of store.groups) {
    if (!_renderedGroups.has(gid)) {
      const el = document.createElement('product-group');
      el.setAttribute('group-id', gid);
      container.appendChild(el);
      _renderedGroups.add(gid);
    }
  }

  emptyState.style.display = store.groups.size > 0 ? 'none' : 'block';
}

function updateOverallTotals() {
  const r = store.calcOverall();
  document.getElementById('ot-groups-val').textContent = r.totalGroups;
  document.getElementById('ot-products-val').textContent = r.totalProducts;
  document.getElementById('ot-cost').textContent = fmt(r.totalCost);
  document.getElementById('ot-revenue').textContent = fmt(r.totalRevenue);

  const profitEl = document.getElementById('ot-profit');
  profitEl.textContent = fmt(r.totalProfit);
  profitEl.style.color = r.totalProfit >= 0 ? 'var(--profit-pos)' : 'var(--profit-neg)';

  document.getElementById('ot-margin').textContent = pct(r.avgMargin);
}

store.subscribe(syncGroups);
store.subscribe(updateOverallTotals);

/* ── Buttons ── */
document.getElementById('btn-add-group').addEventListener('click', () => {
  const gid = uid();
  store.addGroup(gid);
  // Optionally add a default product
});

document.getElementById('btn-save').addEventListener('click', () => {
  try {
    localStorage.setItem('price-architect-data', store.serialize());
    toast('✓ Saved to localStorage');
  } catch (e) {
    toast('✗ Save failed: ' + e.message, 'error');
  }
});

document.getElementById('btn-load').addEventListener('click', () => {
  const raw = localStorage.getItem('price-architect-data');
  if (!raw) { toast('No saved data found', 'error'); return; }
  try {
    container.innerHTML = '';
    container.appendChild(emptyState);
    _renderedGroups.clear();
    store.deserialize(raw);
    toast('✓ Loaded successfully');
  } catch (e) {
    toast('✗ Load failed: ' + e.message, 'error');
  }
});

document.getElementById('btn-export-csv').addEventListener('click', () => {
  const rows = [['Group', 'Product', 'Direct Cost', 'Indirect Cost', 'Other Costs', 'Shared Allocated', 'Total Cost', 'Margin %', 'Selling Price', 'Profit']];
  for (const [gid, g] of store.groups) {
    for (const [pid, p] of g.products) {
      const r = store.calcProduct(gid, pid);
      if (r) {
        rows.push([
          `"${g.name}"`, `"${p.name}"`,
          p.directCost, p.indirectCost, p.otherCosts,
          r.sharedShare.toFixed(2), r.cost.toFixed(2),
          r.margin, r.sellingPrice.toFixed(2), r.profit.toFixed(2)
        ]);
      }
    }
    const sr = store.calcGroup(gid);
    if (sr) {
      rows.push([`"${g.name} SUBTOTAL"`, '', '', '', '', '', sr.totalCost.toFixed(2), '', sr.totalRevenue.toFixed(2), sr.totalProfit.toFixed(2)]);
    }
  }

  const csv = rows.map(r => r.join(',')).join('\n');
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'price-architect-export.csv';
  a.click();
  URL.revokeObjectURL(url);
  toast('✓ CSV exported');
});

/* ── Initial render ── */
syncGroups();
updateOverallTotals();

/* ── Responsive grid adjustment ── */
const mqHandler = () => {
  document.querySelectorAll('.products-grid').forEach(grid => {
    grid.style.gridTemplateColumns = window.innerWidth < 700
      ? '1fr'
      : 'repeat(auto-fill, minmax(260px, 1fr))';
  });
};
window.addEventListener('resize', mqHandler);

/* ── Keyboard shortcut: Ctrl+S to save ── */
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    document.getElementById('btn-save').click();
  }
});

</script>
</body>
</html>
