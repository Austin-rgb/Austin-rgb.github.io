<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loan Calculator</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f6f8;
      color: #333;
    }

    .container {
      max-width: 90%;
      margin: 1rem auto;
      background: white;
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      font-size: 1.4rem;
      color: #2c3e50;
      margin-bottom: 1.5rem;
    }

    label {
      font-weight: bold;
      margin-top: 1rem;
      display: block;
      font-size: 1rem;
    }

    input {
      width: 100%;
      padding: 0.75rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      margin-top: 0.3rem;
      margin-bottom: 1rem;
    }

    button {
      background-color: #3498db;
      color: white;
      padding: 0.75rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      width: 100%;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #2980b9;
    }
    .section {
  margin-bottom: 2rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid #eee;
}
    
    footer{
        text-align: center;
        padding: 10px;
    }

    #plot {
      width: 100%;
      height: 60vh;
      margin-top: 1.5rem;
    }

    @media (min-width: 768px) {
      h2 {
        font-size: 1.75rem;
      }

      .container {
        max-width: 700px;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <h1>Loan Calculator</h1>
    <label>
      Basic Salary:
      <input type="number" v-model.number="basicSalary">
    </label>
    <label>
      Net Salary:
      <input type="number" v-model.number="netSalary">
    </label>
    <label>
      
      Deduction:[ability={{ability}}]
      <input type="number" v-model.number="deduction">
    </label>
    <label>
      Loan Duration (months):[min={{minTerm}},max=120]
      <input type="number" v-model.number="duration">
    </label>
    <label>
      Loan (Kes):[max={{maxLoan}}]
      <input type="number" v-model.number="loan">
    </label>

    <hr>
    <p><strong>Eligible:</strong> {{ isEligible ? 'Yes' : 'No' }}</p>
    
  </div>
  <script type="importmap">
      {
    "imports": {
      "vue": "/vue.esm-browser.js"
    }
  }
  </script>

  <script type="module" src="script.js">
  </script>
  <footer>
    <p>Built with love by <a href="https://github.com/Austin-rgb">Austine</a> for Platinum Credit Limited</p>  
  &copy; <span id="year"></span> Ochieng Austine. All rights reserved.
</footer>

<script>
  document.getElementById("year").textContent = new Date().getFullYear();
</script>
</body>
</html>
